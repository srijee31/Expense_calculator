<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
  <style>
    :root {
      --bg-color: #0f111a;
      --card-bg: #1a1d28;
      --card-inner: #24283b;
      --primary-gold: #f39c12;
      --primary-hover: #d35400;
      --text-main: #f0f2f5;
      --text-muted: #9aa5b1;
      --border-color: #2f354a;
      --accent-green: #2ecc71;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }

    .main-wrapper {
      width: 100%;
      max-width: 780px;
      padding: 12px 16px;
      box-sizing: border-box;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hidden { display: none !important; }

    .btn {
      background: linear-gradient(135deg, #f39c12, #e67e22);
      color: #0f111a;
      font-weight: 700;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88em;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(243, 156, 18, 0.2);
    }

    .btn:hover {
      background: linear-gradient(135deg, #e67e22, #d35400);
      transform: translateY(-1px);
    }

    .btn-tab {
      background: var(--card-inner);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8em;
      font-weight: 600;
    }

    .btn-tab.active {
      background: var(--primary-gold);
      color: #0f111a;
      border-color: var(--primary-gold);
    }

    .intro-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      max-width: 380px;
      margin: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }

    .intro-card h1 { color: var(--primary-gold); margin-bottom: 16px; font-size: 1.5em; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    h1, h2, h3 { color: var(--primary-gold); margin: 0; }
    h1 { font-size: 1.4em; }
    h2 { font-size: 1.15em; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .day-label {
      color: var(--primary-gold);
      font-weight: 700;
      padding-bottom: 4px;
      font-size: 0.85em;
      text-transform: uppercase;
    }

    .date-cell {
      height: 48px;
      padding: 6px;
      background-color: var(--card-inner);
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 0.9em;
      font-weight: 600;
      box-sizing: border-box;
      transition: all 0.15s ease;
    }

    .date-cell:hover {
      border-color: var(--primary-gold);
      background-color: #2d3248;
    }

    .date-cell.empty { background: transparent; cursor: default; border: none; }
    .date-cell.empty:hover { border: none; }

    .date-cell.today {
      border: 1.5px solid var(--primary-gold);
      background-color: #2b2613;
    }

    .tick-mark {
      color: var(--accent-green);
      font-size: 1em;
      align-self: flex-end;
      line-height: 1;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 11, 16, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 12px;
      box-sizing: border-box;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--primary-gold);
      max-height: 85vh;
      overflow-y: auto;
    }

    .field { margin-bottom: 8px; text-align: left; }
    label { display: block; font-size: 0.8em; margin-bottom: 3px; color: var(--text-muted); font-weight: 600; }

    input {
      width: 100%;
      padding: 8px 10px;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.9em;
    }

    input:focus { outline: none; border-color: var(--primary-gold); }

    .actions { display: flex; gap: 8px; margin-top: 14px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: var(--card-inner);
      padding: 10px;
      border-radius: 8px;
      border-left: 3px solid var(--primary-gold);
      cursor: pointer;
    }

    .stat-card span { font-size: 0.75em; color: var(--text-muted); font-weight: 600; }
    .stat-card h3 { color: #fff; margin-top: 2px; font-size: 1.1em; }

    .filter-tabs { display: flex; gap: 6px; margin-bottom: 10px; }

    .category-box {
      background: var(--card-inner);
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.88em;
    }

    footer {
      width: 100%;
      text-align: center;
      padding: 12px 16px;
      background: #090a10;
      border-top: 1px solid var(--border-color);
      box-sizing: border-box;
      margin-top: 10px;
    }

    .quote-text { color: var(--primary-gold); font-size: 0.82em; font-style: italic; margin-bottom: 4px; }
    .copyright-text { color: var(--text-muted); font-size: 0.75em; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- Screen 1: Intro Screen -->
    <div id="intro-screen">
      <div class="intro-card">
        <h1>Welcome</h1>
        <div class="field">
          <label for="user-name">Your Name:</label>
          <input type="text" id="user-name" placeholder="Enter your name">
        </div>
        <div class="field">
          <label for="user-dob">Date of Birth:</label>
          <input type="date" id="user-dob">
        </div>
        <button class="btn" style="width: 100%; margin-top: 12px;" onclick="saveUserInfo()">Continue to Tracker</button>
      </div>
    </div>

    <!-- Screen 2: Main Calendar Screen -->
    <div id="main-screen" class="hidden">
      <div class="header">
        <h1 id="user-title">Expense Reports</h1>
        <button class="btn" onclick="openSummary()">View Summary</button>
      </div>

      <div class="card">
        <div class="calendar-header">
          <button class="btn" onclick="changeMonth(-1)">&lt;</button>
          <h2 id="month-year-title"></h2>
          <button class="btn" onclick="changeMonth(1)">&gt;</button>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>
    </div>
  </div>

  <!-- Entry Modal -->
  <div id="entry-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h2>Log Expense (<span id="modal-date-display"></span>)</h2>
      
      <div class="field"><label>Travel (₹):</label><input type="number" id="amt-Travel" placeholder="0"></div>
      <div class="field"><label>Food (₹):</label><input type="number" id="amt-Food" placeholder="0"></div>
      <div class="field"><label>Groceries (₹):</label><input type="number" id="amt-Groceries" placeholder="0"></div>
      <div class="field"><label>Investment (₹):</label><input type="number" id="amt-Investment" placeholder="0"></div>
      <div class="field"><label>Shopping (₹):</label><input type="number" id="amt-Shopping" placeholder="0"></div>
      <div class="field"><label>Bills (₹):</label><input type="number" id="amt-Bills" placeholder="0"></div>
      <div class="field"><label>Entertainment (₹):</label><input type="number" id="amt-Entertainment" placeholder="0"></div>

      <div class="actions">
        <button class="btn" style="flex:1;" onclick="submitExpense()">Save Entries</button>
        <button class="btn" style="background:#3a3f55; color:#fff;" onclick="closeModal('entry-modal')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Summary Modal -->
  <div id="summary-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h2>Complete Expense Summary</h2>
      
      <div class="stats-grid">
        <div class="stat-card" onclick="setSummaryPeriod('daily')">
          <span>Today</span>
          <h3 id="stat-daily">₹0.00</h3>
        </div>
        <div class="stat-card" onclick="setSummaryPeriod('weekly')">
          <span>This Week</span>
          <h3 id="stat-weekly">₹0.00</h3>
        </div>
        <div class="stat-card" onclick="setSummaryPeriod('monthly')">
          <span>This Month</span>
          <h3 id="stat-monthly">₹0.00</h3>
        </div>
        <div class="stat-card" onclick="setSummaryPeriod('yearly')">
          <span>This Year</span>
          <h3 id="stat-yearly">₹0.00</h3>
        </div>
      </div>

      <div class="filter-tabs">
        <button id="tab-daily" class="btn-tab" onclick="setSummaryPeriod('daily')">Today</button>
        <button id="tab-weekly" class="btn-tab" onclick="setSummaryPeriod('weekly')">Week</button>
        <button id="tab-monthly" class="btn-tab active" onclick="setSummaryPeriod('monthly')">Month</button>
        <button id="tab-yearly" class="btn-tab" onclick="setSummaryPeriod('yearly')">Year</button>
      </div>

      <h3>Category Breakdown</h3>
      <div id="category-list"></div>

      <div class="actions" style="margin-top: 14px;">
        <button class="btn" style="width: 100%;" onclick="closeModal('summary-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="quote-text" id="motivational-quote">"Beware of little expenses. A small leak will sink a great ship."</div>
    <div class="copyright-text">&copy; <span id="year-span"></span> Expense Calculator. All Rights Reserved.</div>
  </footer>

  <script>
    let currentDate = new Date();
    let selectedDateStr = "";
    let activePeriod = 'monthly';

    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const categoryKeys = ['Travel', 'Food', 'Groceries', 'Investment', 'Shopping', 'Bills', 'Entertainment'];

    const quotes = [
      '"Beware of little expenses. A small leak will sink a great ship."',
      '"Do not save what is left after spending, but spend what is left after saving."',
      '"Track every rupee today to build your financial freedom tomorrow."',
      '"A budget tells your money where to go instead of wondering where it went."'
    ];

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('year-span').innerText = new Date().getFullYear();
      document.getElementById('motivational-quote').innerText = quotes[Math.floor(Math.random() * quotes.length)];

      const savedName = localStorage.getItem('expense_user_name');
      if (savedName) {
        showMainScreen(savedName);
      }
    });

    function getLocalExpenses() {
      return JSON.parse(localStorage.getItem('device_expenses')) || [];
    }

    function saveLocalExpenses(data) {
      localStorage.setItem('device_expenses', JSON.stringify(data));
    }

    function saveUserInfo() {
      const name = document.getElementById('user-name').value.trim();
      const dob = document.getElementById('user-dob').value;

      if (!name) {
        alert("Please enter your name.");
        return;
      }

      localStorage.setItem('expense_user_name', name);
      if (dob) localStorage.setItem('expense_user_dob', dob);

      showMainScreen(name);
    }

    function showMainScreen(userName) {
      document.getElementById('user-title').innerText = `${userName}'s Expense Reports`;
      document.getElementById('intro-screen').classList.add('hidden');
      document.getElementById('main-screen').classList.remove('hidden');
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      
      document.getElementById('month-year-title').innerText = `${months[month]} ${year}`;
      
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      days.forEach(d => {
        grid.innerHTML += `<div class="day-label">${d}</div>`;
      });

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const today = new Date();

      const allExpenses = getLocalExpenses();
      const loggedDates = new Set(allExpenses.filter(e => e.amount > 0).map(e => e.date));

      for (let i = 0; i < firstDayIndex; i++) {
        grid.innerHTML += `<div class="date-cell empty"></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
        const formattedDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        const cell = document.createElement('div');
        cell.className = `date-cell ${isToday ? 'today' : ''}`;
        
        let cellHTML = `<span>${day}</span>`;
        if (loggedDates.has(formattedDate)) {
          cellHTML += `<span class="tick-mark">✓</span>`;
        }

        cell.innerHTML = cellHTML;
        cell.onclick = () => openEntry(formattedDate);
        
        grid.appendChild(cell);
      }
    }

    function changeMonth(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      renderCalendar();
    }

    function openEntry(dateStr) {
      selectedDateStr = dateStr;
      document.getElementById('modal-date-display').innerText = dateStr;
      
      // Load existing values for selected date
      const allExpenses = getLocalExpenses();
      const dateEntries = allExpenses.filter(e => e.date === dateStr);

      categoryKeys.forEach(cat => {
        const found = dateEntries.find(e => e.category === cat);
        document.getElementById(`amt-${cat}`).value = found ? found.amount : '';
      });

      document.getElementById('entry-modal').classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function submitExpense() {
      let allExpenses = getLocalExpenses();
      
      // Remove previous records for this date
      allExpenses = allExpenses.filter(e => e.date !== selectedDateStr);

      // Save non-zero categories
      categoryKeys.forEach(cat => {
        const val = parseFloat(document.getElementById(`amt-${cat}`).value);
        if (!isNaN(val) && val > 0) {
          allExpenses.push({ date: selectedDateStr, category: cat, amount: val });
        }
      });

      saveLocalExpenses(allExpenses);
      closeModal('entry-modal');
      renderCalendar();
    }

    function openSummary() {
      const allExpenses = getLocalExpenses();
      const todayStr = new Date().toISOString().split('T')[0];
      const todayDate = new Date();
      const startOfWeek = new Date(todayDate);
      startOfWeek.setDate(todayDate.getDate() - todayDate.getDay());

      let totals = { daily: 0, weekly: 0, monthly: 0, yearly: 0 };
      let byPeriod = {
        daily: {}, weekly: {}, monthly: {}, yearly: {}
      };

      categoryKeys.forEach(c => {
        byPeriod.daily[c] = 0;
        byPeriod.weekly[c] = 0;
        byPeriod.monthly[c] = 0;
        byPeriod.yearly[c] = 0;
      });

      allExpenses.forEach(item => {
        const expDate = new Date(item.date);
        const amt = item.amount;
        const cat = item.category;

        if (!categoryKeys.includes(cat)) return;

        // Daily
        if (item.date === todayStr) {
          totals.daily += amt;
          byPeriod.daily[cat] += amt;
        }

        // Weekly
        if (expDate >= startOfWeek) {
          totals.weekly += amt;
          byPeriod.weekly[cat] += amt;
        }

        // Monthly
        if (expDate.getFullYear() === todayDate.getFullYear() && expDate.getMonth() === todayDate.getMonth()) {
          totals.monthly += amt;
          byPeriod.monthly[cat] += amt;
        }

        // Yearly
        if (expDate.getFullYear() === todayDate.getFullYear()) {
          totals.yearly += amt;
          byPeriod.yearly[cat] += amt;
        }
      });

      document.getElementById('stat-daily').innerText = `₹${totals.daily.toFixed(2)}`;
      document.getElementById('stat-weekly').innerText = `₹${totals.weekly.toFixed(2)}`;
      document.getElementById('stat-monthly').innerText = `₹${totals.monthly.toFixed(2)}`;
      document.getElementById('stat-yearly').innerText = `₹${totals.yearly.toFixed(2)}`;

      window.currentSummaryPeriodData = byPeriod;
      setSummaryPeriod(activePeriod);
      document.getElementById('summary-modal').classList.remove('hidden');
    }

    function setSummaryPeriod(period) {
      activePeriod = period;

      ['daily', 'weekly', 'monthly', 'yearly'].forEach(p => {
        const tab = document.getElementById(`tab-${p}`);
        if (tab) {
          if (p === period) tab.classList.add('active');
          else tab.classList.remove('active');
        }
      });

      const catBox = document.getElementById('category-list');
      catBox.innerHTML = '';

      if (window.currentSummaryPeriodData && window.currentSummaryPeriodData[period]) {
        const periodCategories = window.currentSummaryPeriodData[period];
        for (const [cat, amt] of Object.entries(periodCategories)) {
          catBox.innerHTML += `
            <div class="category-box">
              <span>${cat}</span>
              <strong>₹${amt.toFixed(2)}</strong>
            </div>`;
        }
      }
    }
  </script>
</body>
</html>
