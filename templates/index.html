<!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC5O_FuiZFL1GwHmGmrAS_nGAdliQ81DuQ",
      authDomain: "expense-calculator-c8b9d.firebaseapp.com",
      projectId: "expense-calculator-c8b9d",
      storageBucket: "expense-calculator-c8b9d.firebasestorage.app",
      messagingSenderId: "433220001220",
      appId: "1:433220001220:web:140682deef6a675f72d891",
      measurementId: "G-NKRZWVSCBE"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let currentDate = new Date();
    let selectedDateStr = "";
    let activeSummaryPeriod = 'monthly';

    const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const shortMonths = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const categoryKeys = ['Travel', 'Food', 'Groceries', 'Investment', 'Shopping', 'Bills', 'Entertainment'];
    const categoryColors = { Food: '#f59e0b', Travel: '#3b82f6', Shopping: '#a855f7', Investment: '#10b981', Groceries: '#f97316', Bills: '#ef4444', Entertainment: '#06b6d4' };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        updateTimeBasedGreeting(user.displayName || "User");
        await loadUserDataFromFirestore(user.uid);
      } else {
        currentUser = null;
        handleGoogleLogin();
      }
    });

    async function handleGoogleLogin() {
      try {
        const result = await signInWithPopup(auth, provider);
        currentUser = result.user;
        updateTimeBasedGreeting(currentUser.displayName || "User");
        await loadUserDataFromFirestore(currentUser.uid);
      } catch (error) {
        console.error("Authentication Error:", error);
      }
    }

    async function loadUserDataFromFirestore(uid) {
      try {
        const userDocRef = doc(db, "users", uid);
        const docSnap = await getDoc(userDocRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          localStorage.setItem('device_expenses', JSON.stringify(data.expenses || []));
          localStorage.setItem('monthly_income', data.income || 0);
          document.getElementById('monthly-income-input').value = data.income || 0;
        }
      } catch (err) {
        console.error("Firestore Load Error:", err);
      }

      renderCalendar();
      updateDashboardStats();
    }

    async function syncDataToFirestore() {
      if (!currentUser) return;
      const expenses = getLocalExpenses();
      const income = parseFloat(localStorage.getItem('monthly_income')) || 0;

      try {
        await setDoc(doc(db, "users", currentUser.uid), {
          expenses: expenses,
          income: income,
          lastUpdated: new Date().toISOString()
        });
      } catch (err) {
        console.error("Firestore Sync Error:", err);
      }
    }

    function updateTimeBasedGreeting(name) {
      const currentHour = new Date().getHours();
      let greetingPrefix = "Good Evening";

      if (currentHour >= 5 && currentHour < 12) {
        greetingPrefix = "Good Morning";
      } else if (currentHour >= 12 && currentHour < 17) {
        greetingPrefix = "Good Afternoon";
      }

      document.getElementById('welcome-heading').innerText = `${greetingPrefix}, ${name} 👋`;
    }

    function getLocalExpenses() {
      return JSON.parse(localStorage.getItem('device_expenses')) || [];
    }

    function saveLocalExpenses(data) {
      localStorage.setItem('device_expenses', JSON.stringify(data));
    }

    window.updateIncome = function() {
      const val = parseFloat(document.getElementById('monthly-income-input').value) || 0;
      localStorage.setItem('monthly_income', val);
      updateDashboardStats();
      syncDataToFirestore();
    };

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('month-year-title').innerText = `${months[month]} ${year}`;
      
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      days.forEach(d => grid.innerHTML += `<div class="day-label">${d}</div>`);

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const today = new Date();
      const allExpenses = getLocalExpenses();

      let dailySums = {};
      allExpenses.forEach(e => {
        if (!dailySums[e.date]) dailySums[e.date] = 0;
        dailySums[e.date] += e.amount;
      });

      for (let i = 0; i < firstDayIndex; i++) grid.innerHTML += `<div class="date-cell empty"></div>`;

      for (let day = 1; day <= totalDays; day++) {
        const formattedDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
        const totalAmount = dailySums[formattedDate] || 0;
        const hasEntry = totalAmount > 0;

        const cell = document.createElement('div');
        cell.className = `date-cell ${isToday ? 'today' : ''} ${hasEntry ? 'logged' : ''}`;
        
        let cellHTML = `<span>${day}</span>`;
        if (hasEntry) {
          const displayAmount = totalAmount >= 1000 ? `₹${(totalAmount / 1000).toFixed(1)}k` : `₹${totalAmount}`;
          cellHTML += `
            <div class="cell-footer">
              <span class="cell-amount">${displayAmount}</span>
              <span class="tick-mark">✓</span>
            </div>`;
        }

        cell.innerHTML = cellHTML;
        cell.onclick = () => openEntry(formattedDate);
        grid.appendChild(cell);
      }
    }

    window.changeMonth = function(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      renderCalendar();
      updateDashboardStats();
    };

    function openEntry(dateStr) {
      selectedDateStr = dateStr;
      document.getElementById('modal-date-display').innerText = dateStr;
      const allExpenses = getLocalExpenses();
      const dateEntries = allExpenses.filter(e => e.date === dateStr);

      categoryKeys.forEach(cat => {
        const found = dateEntries.find(e => e.category === cat);
        document.getElementById(`amt-${cat}`).value = found ? found.amount : '';
      });

      document.getElementById('entry-modal').classList.remove('hidden');
    }

    window.closeModal = function(id) {
      document.getElementById(id).classList.add('hidden');
    };

    window.submitExpense = function() {
      let allExpenses = getLocalExpenses().filter(e => e.date !== selectedDateStr);

      categoryKeys.forEach(cat => {
        const val = parseFloat(document.getElementById(`amt-${cat}`).value);
        if (!isNaN(val) && val > 0) {
          allExpenses.push({ date: selectedDateStr, category: cat, amount: val });
        }
      });

      saveLocalExpenses(allExpenses);
      syncDataToFirestore();
      closeModal('entry-modal');
      renderCalendar();
      updateDashboardStats();
    };

    function updateDashboardStats() {
      const allExpenses = getLocalExpenses();
      const income = parseFloat(localStorage.getItem('monthly_income')) || 0;
      let total = 0;
      let categoryTotals = {};

      categoryKeys.forEach(c => categoryTotals[c] = 0);

      allExpenses.forEach(e => {
        total += e.amount;
        if (categoryTotals[e.category] !== undefined) {
          categoryTotals[e.category] += e.amount;
        }
      });

      const balance = income - total;

      document.getElementById('disp-income').innerText = `₹${income.toLocaleString('en-IN')}`;
      document.getElementById('total-expenses').innerText = `₹${total.toLocaleString('en-IN')}`;
      document.getElementById('total-balance').innerText = `₹${balance.toLocaleString('en-IN')}`;
      document.getElementById('total-balance').style.color = balance < 0 ? 'var(--accent-red)' : 'var(--accent-green)';

      const progressContainer = document.getElementById('category-progress-list');
      progressContainer.innerHTML = '';

      categoryKeys.forEach(cat => {
        const catAmount = categoryTotals[cat];
        const percentage = total > 0 ? Math.min(100, Math.round((catAmount / total) * 100)) : 0;

        progressContainer.innerHTML += `
          <div class="progress-item">
            <div class="progress-info">
              <span>${cat}</span>
              <strong>₹${catAmount.toLocaleString('en-IN')}</strong>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${percentage}%; background-color: ${categoryColors[cat] || '#f59e0b'};"></div>
            </div>
          </div>
        `;
      });

      renderDailyExpenseChart('daily-chart-svg', 500, 180);
      if (document.getElementById('fullscreen-graph-modal').classList.contains('active')) {
        renderDailyExpenseChart('fullscreen-chart-svg', 1000, 500);
      }
    }

    function renderDailyExpenseChart(svgId, viewBoxW, viewBoxH) {
      const svg = document.getElementById(svgId);
      if (!svg) return;
      svg.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const allExpenses = getLocalExpenses();

      let dailyTotals = {};
      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        dailyTotals[day] = 0;
        allExpenses.forEach(e => {
          if (e.date === dateStr) dailyTotals[day] += e.amount;
        });
      }

      const maxExpense = Math.max(...Object.values(dailyTotals), 1000);
      const paddingLeft = 55;
      const paddingBottom = 30;
      const width = viewBoxW - paddingLeft;
      const height = viewBoxH - paddingBottom;

      for (let i = 0; i <= 3; i++) {
        const yVal = Math.round((maxExpense / 3) * i);
        const yPos = height - (i * (height / 3)) + 10;

        svg.innerHTML += `
          <line x1="${paddingLeft}" y1="${yPos}" x2="${viewBoxW}" y2="${yPos}" stroke="#374151" stroke-dasharray="3,3" />
          <text x="${paddingLeft - 10}" y="${yPos + 4}" fill="#9ca3af" font-size="10" text-anchor="end">₹${yVal.toLocaleString('en-IN')}</text>
        `;
      }

      let points = [];
      const stepX = width / (totalDays - 1);

      for (let day = 1; day <= totalDays; day++) {
        const x = paddingLeft + (day - 1) * stepX;
        const y = height - (dailyTotals[day] / maxExpense) * height + 10;
        const dateStr = `${shortMonths[month]} ${day}, ${year}`;
        points.push({ x, y, day, amount: dailyTotals[day], dateStr });
      }

      let pathD = `M ${points[0].x} ${points[0].y}`;
      for (let i = 1; i < points.length; i++) {
        pathD += ` L ${points[i].x} ${points[i].y}`;
      }

      const areaD = `${pathD} L ${points[points.length - 1].x} ${height + 10} L ${paddingLeft} ${height + 10} Z`;
      svg.innerHTML += `<path d="${areaD}" fill="rgba(245, 158, 11, 0.12)" />`;
      svg.innerHTML += `<path d="${pathD}" fill="none" stroke="#f59e0b" stroke-width="2.5" />`;

      points.forEach(p => {
        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");

        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("cx", p.x);
        dot.setAttribute("cy", p.y);
        dot.setAttribute("r", p.amount > 0 ? "5" : "3");
        dot.setAttribute("fill", p.amount > 0 ? "#10b981" : "#f59e0b");

        const hitArea = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        hitArea.setAttribute("cx", p.x);
        hitArea.setAttribute("cy", p.y);
        hitArea.setAttribute("r", "16");
        hitArea.setAttribute("fill", "transparent");
        hitArea.setAttribute("style", "cursor: pointer;");

        const tooltipGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        tooltipGroup.setAttribute("style", "display: none; pointer-events: none;");

        const labelText = `${p.dateStr} (₹${p.amount.toLocaleString('en-IN')})`;
        const approxWidth = labelText.length * 6.5 + 16;
        const ttX = Math.min(Math.max(p.x - approxWidth / 2, paddingLeft), viewBoxW - approxWidth - 10);
        const ttY = Math.max(p.y - 30, 15);

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", ttX);
        rect.setAttribute("y", ttY - 14);
        rect.setAttribute("width", approxWidth);
        rect.setAttribute("height", "22");
        rect.setAttribute("rx", "4");
        rect.setAttribute("fill", "#111827");
        rect.setAttribute("stroke", "#f59e0b");
        rect.setAttribute("stroke-width", "1");

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", ttX + approxWidth / 2);
        text.setAttribute("y", ttY + 1);
        text.setAttribute("fill", "#ffffff");
        text.setAttribute("font-size", "10");
        text.setAttribute("font-weight", "600");
        text.setAttribute("text-anchor", "middle");
        text.textContent = labelText;

        tooltipGroup.appendChild(rect);
        tooltipGroup.appendChild(text);

        hitArea.onmouseover = () => {
          dot.setAttribute("r", "8");
          tooltipGroup.setAttribute("style", "display: block; pointer-events: none;");
        };

        hitArea.onmouseout = () => {
          dot.setAttribute("r", p.amount > 0 ? "5" : "3");
          tooltipGroup.setAttribute("style", "display: none; pointer-events: none;");
        };

        hitArea.onclick = () => {
          alert(`${p.dateStr}\nExpense: ₹${p.amount.toLocaleString('en-IN')}`);
        };

        group.appendChild(dot);
        group.appendChild(hitArea);
        group.appendChild(tooltipGroup);
        svg.appendChild(group);

        if (p.day === 1 || p.day % 5 === 0 || p.day === totalDays) {
          svg.innerHTML += `
            <text x="${p.x}" y="${height + 24}" fill="#9ca3af" font-size="10" text-anchor="middle">${p.day}</text>
          `;
        }
      });
    }

    window.toggleGraphZoom = function(enable) {
      const modal = document.getElementById('fullscreen-graph-modal');
      if (enable) {
        modal.classList.add('active');
        renderDailyExpenseChart('fullscreen-chart-svg', 1000, 500);
      } else {
        modal.classList.remove('active');
      }
    };

    window.openFullSummaryView = function() {
      document.getElementById('nav-dashboard').classList.remove('active');
      document.getElementById('nav-summary').classList.add('active');
      document.getElementById('fullscreen-summary-page').classList.add('active');
      calculateAndRenderSummary();
    };

    window.showDashboardView = function() {
      document.getElementById('nav-summary').classList.remove('active');
      document.getElementById('nav-dashboard').classList.add('active');
      document.getElementById('fullscreen-summary-page').classList.remove('active');
    };

    function calculateAndRenderSummary() {
      const allExpenses = getLocalExpenses();
      const todayStr = new Date().toISOString().split('T')[0];
      const todayDate = new Date();
      const startOfWeek = new Date(todayDate);
      startOfWeek.setDate(todayDate.getDate() - todayDate.getDay());

      let periodTotals = { daily: 0, weekly: 0, monthly: 0, yearly: 0 };
      let byPeriodCategories = { daily: {}, weekly: {}, monthly: {}, yearly: {} };

      categoryKeys.forEach(c => {
        byPeriodCategories.daily[c] = 0;
        byPeriodCategories.weekly[c] = 0;
        byPeriodCategories.monthly[c] = 0;
        byPeriodCategories.yearly[c] = 0;
      });

      allExpenses.forEach(item => {
        const expDate = new Date(item.date);
        const amt = item.amount;
        const cat = item.category;

        if (!categoryKeys.includes(cat)) return;

        if (item.date === todayStr) {
          periodTotals.daily += amt;
          byPeriodCategories.daily[cat] += amt;
        }

        if (expDate >= startOfWeek) {
          periodTotals.weekly += amt;
          byPeriodCategories.weekly[cat] += amt;
        }

        if (expDate.getFullYear() === todayDate.getFullYear() && expDate.getMonth() === todayDate.getMonth()) {
          periodTotals.monthly += amt;
          byPeriodCategories.monthly[cat] += amt;
        }

        if (expDate.getFullYear() === todayDate.getFullYear()) {
          periodTotals.yearly += amt;
          byPeriodCategories.yearly[cat] += amt;
        }
      });

      window.fullSummaryData = { periodTotals, byPeriodCategories };
      setFullSummaryPeriod(activeSummaryPeriod);
    }

    window.setFullSummaryPeriod = function(period) {
      activeSummaryPeriod = period;

      ['daily', 'weekly', 'monthly', 'yearly'].forEach(p => {
        const tabBtn = document.getElementById(`sum-tab-${p}`);
        if (tabBtn) {
          if (p === period) tabBtn.classList.add('active');
          else tabBtn.classList.remove('active');
        }
      });

      if (!window.fullSummaryData) return;

      const titles = {
        daily: "Today's Total Spending",
        weekly: "This Week's Total Spending",
        monthly: "This Month's Total Spending",
        yearly: "This Year's Total Spending"
      };

      const totalAmt = window.fullSummaryData.periodTotals[period] || 0;
      document.getElementById('summary-period-title').innerText = titles[period];
      document.getElementById('summary-period-total').innerText = `₹${totalAmt.toLocaleString('en-IN')}`;

      const grid = document.getElementById('summary-categories-grid');
      grid.innerHTML = '';

      const categoriesData = window.fullSummaryData.byPeriodCategories[period] || {};

      for (const cat of categoryKeys) {
        const amt = categoriesData[cat] || 0;
        const percentage = totalAmt > 0 ? Math.min(100, Math.round((amt / totalAmt) * 100)) : 0;

        grid.innerHTML += `
          <div class="summary-cat-card">
            <div class="progress-info">
              <span style="font-weight: 600;">${cat}</span>
              <strong style="color: var(--primary-gold);">₹${amt.toLocaleString('en-IN')}</strong>
            </div>
            <div class="progress-bar-bg" style="margin-top: 8px;">
              <div class="progress-bar-fill" style="width: ${percentage}%; background-color: ${categoryColors[cat] || '#f59e0b'};"></div>
            </div>
            <div style="font-size: 0.75em; color: var(--text-muted); margin-top: 6px; text-align: right;">${percentage}% of total</div>
          </div>
        `;
      }
    };

    window.resetUser = function() {
      if (confirm("Sign out and reset user data?")) {
        signOut(auth).then(() => {
          localStorage.clear();
          location.reload();
        });
      }
    };
  </script>
